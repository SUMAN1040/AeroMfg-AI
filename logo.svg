<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 36" width="160" height="36" fill="none">
  <!-- Gear & Circuit Nodes (Left side) -->
  <g fill="#0052cc">
    <!-- Gear teeth on the left edge -->
    <path d="M 12 10 L 9 8.5 L 7.5 11 L 10 12.5 C 9.7 13.5 9.5 14.5 9.5 15.5 L 6.5 15.5 L 6.5 18.5 L 9.5 18.5 C 9.5 19.5 9.7 20.5 10 21.5 L 7.5 23 L 9 25.5 L 12 24 C 12.8 24.8 13.7 25.4 14.7 25.8 L 14.7 29 L 17.7 29 L 18 26 C 18.7 26 19.3 25.9 20 25.7 L 20 21 C 18.5 21 17.2 20.4 16.2 19.4 C 15.2 18.4 14.5 17 14.5 15.5 C 14.5 14 15.2 12.6 16.2 11.6 L 16.2 7 C 14.8 7.6 13.3 8.6 12 10 Z" opacity="0.95" />
    
    <!-- Digital Circuit Lines and Nodes -->
    <circle cx="11" cy="15.5" r="1.2" fill="#38bdf8" />
    <circle cx="13" cy="18.5" r="1.2" fill="#38bdf8" />
    <path d="M 11 15.5 L 15 15.5" stroke="#38bdf8" stroke-width="0.8" />
    <path d="M 13 18.5 L 16 18.5" stroke="#38bdf8" stroke-width="0.8" />
  </g>

  <!-- Stylized Letter 'A' with Wing Silhouette -->
  <g>
    <!-- Left Leg -->
    <polygon points="17,30 22,30 27,8 21.5,8" fill="#0052cc" />
    <!-- Right Leg -->
    <polygon points="26,8 31,8 37,30 31.5,30" fill="#0047b3" />
    <!-- Inner Apex Cutout -->
    <polygon points="24.5,13 22,23 27,23" fill="#ffffff" />
    
    <!-- Aerodynamic Forward Swoosh / Orbital Wing -->
    <path d="M 14 20 Q 24 16 38 18.5 Q 26 23.5 17 23.5 Z" fill="#38bdf8" />
    <path d="M 16 21 Q 25 18 39 19 Q 28 23 18 23 Z" fill="#0052cc" />
  </g>

  <!-- Brand Typography -->
  <text x="44" y="24" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#0c1a30">AeroMFG</tspan><tspan fill="#0052cc" font-weight="700">AI</tspan>
  </text>
</svg>
